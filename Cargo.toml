[package]
name = "rfig"
version = "0.3.1"
edition = "2021"
description = "Inline terminal command completion and history suggestions for zsh, Bash, Fish and PowerShell"
license = "MIT"
repository = "https://github.com/tamia6/rfig"
homepage = "https://tamia6.github.io/rfig/"

[dependencies]
crossterm = { version = "0.28", features = ["use-dev-tty"] }
unicode-width = "0.2"
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
