name: Release binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal binary
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          bundle="dist/rfig-$GITHUB_REF_NAME"
          mkdir -p "$bundle"
          lipo -create \
            target/aarch64-apple-darwin/release/rfig \
            target/x86_64-apple-darwin/release/rfig \
            -output "$bundle/rfig"
          chmod 755 "$bundle/rfig"
          printf 'macos-universal\n' > "$bundle/TARGET"
          cp install.sh rfig.zsh rfig.bash rfig.fish LICENSE "$bundle/"
          (cd "$bundle" && shasum -a 256 rfig rfig.zsh rfig.bash rfig.fish LICENSE TARGET > SHA256SUMS)
          tar -czf "dist/rfig-$GITHUB_REF_NAME-macos-universal.tar.gz" -C dist "rfig-$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*.tar.gz

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    # Debian 12 provides a common glibc 2.36 build baseline for both architectures.
    container: rust:1.91-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cargo test --locked -j 2
          cargo build --locked -j 2
          cargo build --release --locked -j 2
      - name: Verify native Linux isolation and installation
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 zsh fish bash-completion
          useradd -m tester
          chown -R tester:tester "$GITHUB_WORKSPACE"
          su tester -s /bin/sh -c "cd '$GITHUB_WORKSPACE' && python3 tests/linux_sandbox.py && python3 tests/setup_safety.py && python3 tests/self_completion.py && python3 tests/install_binary.py"
      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bundle="dist/rfig-$GITHUB_REF_NAME"
          mkdir -p "$bundle"
          cp target/release/rfig install.sh rfig.zsh rfig.bash rfig.fish LICENSE "$bundle/"
          printf 'linux-%s\n' "$ARCH" > "$bundle/TARGET"
          (cd "$bundle" && sha256sum rfig rfig.zsh rfig.bash rfig.fish LICENSE TARGET > SHA256SUMS)
          tar -czf "dist/rfig-$GITHUB_REF_NAME-linux-$ARCH.tar.gz" -C dist "rfig-$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
