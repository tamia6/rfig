name: Release binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal binary
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          bundle="dist/rfig-$GITHUB_REF_NAME"
          mkdir -p "$bundle"
          lipo -create \
            target/aarch64-apple-darwin/release/rfig \
            target/x86_64-apple-darwin/release/rfig \
            -output "$bundle/rfig"
          chmod 755 "$bundle/rfig"
          cp install.sh rfig.zsh LICENSE "$bundle/"
          (cd "$bundle" && shasum -a 256 rfig rfig.zsh LICENSE > SHA256SUMS)
          tar -czf "dist/rfig-$GITHUB_REF_NAME-macos-universal.tar.gz" -C dist "rfig-$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/rfig-$GITHUB_REF_NAME-macos-universal.tar.gz" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
